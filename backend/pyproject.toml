[project]
name = "snipsel-backend"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = [
  "Flask>=3.1.3",
  "Flask-Cors>=6.0.5",
  "Flask-Migrate>=4.1.0",
  "Flask-SQLAlchemy>=3.1.1",
  "python-dotenv>=1.2.4",
  "SQLAlchemy>=2.1.0",
  "python-dateutil>=2.9.0.post0",
  "Authlib>=1.8.0",
  "requests>=2.33.0",
  "Flask-Caching>=2.5.1",
  "Pillow>=12.3.0",
  "pillow-heif>=1.8.0",
  "joserfc>=1.7.5",
  "cryptography>=50.0.1",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["snipsel_api*"]
