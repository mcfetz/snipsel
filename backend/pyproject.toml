[project]
name = "snipsel-backend"
version = "0.0.0"
requires-python = ">=3.9"
dependencies = [
  "Flask>=3.1.0",
  "Flask-Cors>=6.0.2",
  "Flask-Migrate>=4.0.7",
  "Flask-SQLAlchemy>=3.1.1",
  "python-dotenv>=1.2.1",
  "SQLAlchemy>=2.0.49",
  "python-dateutil>=2.9.0.post0",
  "Authlib>=1.6.11",
  "requests>=2.32.5",
  "Flask-Caching>=2.3.1",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["snipsel_api*"]
