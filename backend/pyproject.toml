[project]
name = "snipsel-backend"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = [
  "Flask>=3.1.3",
  "Flask-Cors>=6.0.2",
  "Flask-Migrate>=4.1.0",
  "Flask-SQLAlchemy>=3.1.1",
  "python-dotenv>=1.2.2",
  "SQLAlchemy>=2.0.49",
  "python-dateutil>=2.9.0.post0",
  "Authlib>=1.6.12",
  "requests>=2.33.0",
  "Flask-Caching>=2.3.1",
  "Pillow>=12.3.0",
  "pillow-heif>=1.3.0",
  "joserfc>=1.6.8",
  "cryptography>=49.0.0",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["snipsel_api*"]
