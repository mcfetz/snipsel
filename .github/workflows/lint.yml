name: Lint

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Run ruff check
        run: uvx --from ruff==0.16.10 ruff check .

      - name: Check ruff formatting
        run: uvx --from ruff==0.16.10 ruff format --check .

  ty:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run ty
        run: uvx --from ty==0.0.84 ty check .
