name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: uv bereitstellen
        uses: astral-sh/setup-uv@v10.2.0

      - name: Ruff check
        run: uvx --from ruff==0.16.10 ruff check .

      - name: Ruff format
        run: uvx --from ruff==0.16.10 ruff format --check .

  ty:
    runs-on: ubuntu-latest
    # ty loest die Typen nur mit installierten Abhaengigkeiten auf — ohne `uv sync`
    # meldet es Hunderte Phantomfehler (162 gemessen). Deshalb wie in der alten
    # GitHub-CI im backend/ arbeiten und vorher synchronisieren.
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: uv bereitstellen
        uses: astral-sh/setup-uv@v10.2.0

      - name: Abhaengigkeiten
        run: uv sync --frozen

      - name: ty check
        run: uvx --from ty==0.0.84 ty check .

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          set -euo pipefail
          cd frontend
          npm ci
          npm run build
